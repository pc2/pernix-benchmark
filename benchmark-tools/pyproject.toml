[project]
name = "pernix-benchmark-tools"
version = "0.1.0"
description = "CLI tools for building, running, and processing Pernix benchmarks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cmake>=4.4",
    "ninja>=1.13",
    "machinestate>=0.6",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=9.1",
    "ruff>=0.15",
]
notebook = [
    "ipykernel>=7.3",
    "ipywidgets>=8.1",
    "jupyterlab>=4.6",
    "matplotlib>=3.11",
    "pandas>=3.0",
    "seaborn>=0.13",
]

[project.scripts]
pernix-bench = "pernix_benchmark_tools.__main__:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"
